[build-system]
requires = ["scikit-build-core==1.1.2", "dynamic-metadata==0.7.0"]
build-backend = "scikit_build_core.build"

[project]
name = "metapreserve-mailbox-demo"
version = "1.0"
authors = [{name = "Last, First", email = "first@example.com"}, {email = "second@example.com"}]
maintainers = [{name = "Maintainer, One", email = "maintainer@example.com"}]
dynamic = ["authors", "maintainers"]

[[tool.dynamic-metadata]]
provider = {path = "plugins", module = "extend"}

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.cmake = false
sdist.include = ["plugins/extend.py"]
